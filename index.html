<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16121f">
<title>Grimoire — D&D Character Manager</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#16121f; --bg2:#1e1830; --card:#251d3a; --card2:#2e2547;
  --line:#3a2f5c; --txt:#eae4f5; --dim:#9d92bd; --accent:#a06cd5; --accent2:#c39bd3;
  --gold:#e0b45c; --red:#e35d6a; --green:#5dc98a; --blue:#5da9e3;
  --radius:14px; --nav-h:60px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px}
body{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 8px)}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--txt);background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
label{font-size:12px;color:var(--dim);display:block;margin-bottom:3px;text-transform:uppercase;letter-spacing:.05em}
h1{font-size:22px;margin:0} h2{font-size:17px;margin:0 0 10px} h3{font-size:15px;margin:0}
.screen{display:none;padding:14px;max-width:760px;margin:0 auto}
.screen.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.btn{background:var(--accent);color:#fff;border-radius:10px;padding:10px 16px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.btn.danger{background:var(--red)}
.btn.small{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.gold{background:var(--gold);color:#241c10}
.pill{display:inline-flex;align-items:center;gap:4px;background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer;user-select:none}
.pill.on{background:var(--accent);border-color:var(--accent);color:#fff}
.dim{color:var(--dim);font-size:13px}
.center{text-align:center}
.spacer{height:8px}
hr{border:none;border-top:1px solid var(--line);margin:12px 0}

/* Top bar — #hdr is the sticky element so the status strip rides with it */
#hdr{position:sticky;top:0;z-index:50}
#topbar{background:linear-gradient(180deg,var(--bg2),rgba(30,24,48,.96));backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 14px calc(10px);display:flex;align-items:center;gap:10px}
#topbar .title{flex:1;min-width:0}
#topbar .title .nm{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .title .sub{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:38px;height:38px;border-radius:10px;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}

/* Bottom nav */
#nav{position:fixed;bottom:0;left:0;right:0;z-index:50;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--bg2);border-top:1px solid var(--line);display:none;grid-template-columns:repeat(6,1fr)}
#nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:9.5px;color:var(--dim);letter-spacing:0;padding:0 1px}
#nav button .ic{font-size:19px;line-height:1}
@media(min-width:420px){#nav button{font-size:10.5px}#nav button .ic{font-size:20px}}

/* Always-visible status strip: conditions, exhaustion, concentration */
#statusbar{display:none;background:var(--bg2);border-bottom:1px solid var(--line);padding:6px 10px;gap:6px;flex-wrap:wrap;align-items:center}
#statusbar.on{display:flex}
#statusbar .sb{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:3px 10px;font-size:12px;border:1px solid var(--line);background:var(--card2);cursor:pointer;white-space:nowrap}
#statusbar .sb.cond{border-color:var(--red);color:var(--red)}
#statusbar .sb.exh{border-color:var(--gold);color:var(--gold)}
#statusbar .sb.conc{border-color:var(--accent2);color:var(--accent2)}
#nav button.on{color:var(--accent2)}

/* Ability blocks */
.abl-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.abl{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px 2px;text-align:center;cursor:pointer}
.abl .a-name{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.abl .a-mod{font-size:19px;font-weight:700;color:var(--accent2)}
.abl .a-score{font-size:11px;color:var(--dim)}
@media(max-width:430px){.abl-grid{grid-template-columns:repeat(3,1fr)}}

/* HP */
.hp-wrap{display:flex;align-items:center;gap:10px}
.hp-num{font-size:30px;font-weight:800;min-width:110px;text-align:center}
.hp-num .mx{font-size:16px;color:var(--dim);font-weight:600}
.hpbar{height:8px;background:var(--bg2);border-radius:99px;overflow:hidden;margin-top:6px}
.hpbar>div{height:100%;background:var(--green);border-radius:99px;transition:width .25s}
.stepbtn{width:44px;height:44px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:22px;font-weight:700;flex:none}
.statbox{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.statbox .v{font-size:20px;font-weight:700}
.statbox .l{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}

/* skill rows */
.skrow{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line)}
.skrow:last-child{border-bottom:none}
.skrow .prof{width:20px;height:20px;border-radius:50%;border:2px solid var(--dim);flex:none;cursor:pointer;position:relative}
.skrow .prof.p1{background:var(--accent);border-color:var(--accent)}
.skrow .prof.p2{background:var(--gold);border-color:var(--gold)}
.skrow .nm{flex:1;font-size:15px}
.skrow .ab{font-size:11px;color:var(--dim);text-transform:uppercase;width:32px}
.skrow .md{font-weight:700;font-size:16px;width:44px;text-align:right;color:var(--accent2);cursor:pointer;padding:4px;border-radius:8px}
.skrow .md:active{background:var(--card2)}

/* pips */
.pips{display:flex;gap:6px;flex-wrap:wrap}
.pip{width:22px;height:22px;border-radius:50%;border:2px solid var(--accent);cursor:pointer}
.pip.used{background:var(--line);border-color:var(--line)}
.pip.full{background:var(--accent)}

/* list items */
.li{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px}
.li .li-head{display:flex;align-items:center;gap:8px;cursor:pointer;flex-wrap:wrap}
.li .li-title{flex:1 1 55%;font-weight:600;min-width:0}
.li .li-sub{font-size:12px;color:var(--dim)}
.li .li-body{display:none;margin-top:10px;font-size:14px;color:var(--txt)}
.li.open .li-body{display:block}
.li .li-body p{margin:6px 0}
.tag{font-size:10.5px;background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:var(--dim);white-space:nowrap}
.tag.c{color:var(--gold);border-color:var(--gold)}
.tag.r{color:var(--blue);border-color:var(--blue)}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:none;align-items:flex-end;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:var(--card);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:760px;max-height:88vh;overflow-y:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:760px){.modal-bg{align-items:center}.modal{border-radius:18px}}
.modal h2{display:flex;justify-content:space-between;align-items:center}

/* toast */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 20px);z-index:200;background:var(--card2);border:1px solid var(--accent);border-radius:14px;padding:12px 18px;font-size:15px;display:none;max-width:90vw;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#toast.show{display:block;animation:pop .18s ease-out}
@keyframes pop{from{transform:translateX(-50%) scale(.9);opacity:0}}
#toast .big{font-size:26px;font-weight:800;color:var(--accent2)}
/* 🎆 lucky 14 */
.fw14{position:relative;display:inline-block;animation:fwglow 1.2s ease-in-out infinite}
.fw14 .sp{position:absolute;left:50%;top:50%;font-size:15px;pointer-events:none;animation:fwpop 1.1s ease-out infinite}
@keyframes fwpop{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}25%{opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.3);opacity:0}}
@keyframes fwglow{0%,100%{text-shadow:0 0 6px var(--gold)}50%{text-shadow:0 0 18px var(--gold),0 0 30px var(--accent2)}}

/* character list */
.charcard{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px;cursor:pointer}
.charcard .avatar{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:#fff;flex:none}
.charcard .info{flex:1;min-width:0}
.charcard .cnm{font-weight:700;font-size:17px}
.charcard .csub{font-size:13px;color:var(--dim)}

.searchwrap{position:sticky;top:0;background:var(--card);padding:6px 0;z-index:5}
.dice-adv{display:flex;gap:6px;margin-top:8px}
.cond-grid{display:flex;flex-wrap:wrap;gap:6px}
.slot-lv{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.slot-lv:last-child{border:none}
.slot-lv .lv{width:56px;font-weight:700;font-size:14px}
.death-dots{display:flex;gap:8px}
.ddot{width:24px;height:24px;border-radius:50%;border:2px solid var(--dim);cursor:pointer}
.ddot.s{background:var(--green);border-color:var(--green)}
.ddot.f{background:var(--red);border-color:var(--red)}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.empty{color:var(--dim);text-align:center;padding:20px 10px;font-size:14px}
.warn{color:var(--red)} .good{color:var(--green)}
textarea{min-height:80px;resize:vertical}
.filter-pills{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.filter-pills::-webkit-scrollbar{display:none}
</style>
</head>
<body>

<div id="hdr">
  <div id="topbar" style="display:none">
    <button class="iconbtn" id="btnBack" title="Characters">👥</button>
    <div class="title"><div class="nm" id="tbName"></div><div class="sub" id="tbSub"></div></div>
    <button class="iconbtn" id="btnDice" title="Dice roller">🎲</button>
    <button class="iconbtn" id="btnMenu" title="Menu">⋮</button>
  </div>
  <div id="statusbar"></div>
</div>

<!-- ============ CHARACTER LIST ============ -->
<div class="screen" id="scr-list">
  <div style="display:flex;align-items:center;justify-content:space-between;margin:6px 0 16px">
    <h1>🐉 Grimoire</h1>
    <button class="iconbtn" id="btnSettings" title="App settings">⚙️</button>
  </div>
  <div id="charList"></div>
  <button class="btn" style="width:100%" id="btnNewChar">＋ New character</button>
  <div class="spacer"></div>
  <button class="btn ghost" style="width:100%" id="btnImportChar">📥 Import character (JSON)</button>
  <input type="file" id="fileImport" accept=".json,application/json" style="display:none">
  <p class="dim center" id="srdStatus" style="margin-top:18px"></p>
</div>

<!-- ============ MAIN TAB ============ -->
<div class="screen" id="scr-main"></div>
<!-- ============ SKILLS TAB ============ -->
<div class="screen" id="scr-skills"></div>
<!-- ============ SPELLS TAB ============ -->
<div class="screen" id="scr-spells"></div>
<!-- ============ COMPANIONS TAB ============ -->
<div class="screen" id="scr-comp"></div>
<!-- ============ INVENTORY TAB ============ -->
<div class="screen" id="scr-inv"></div>
<!-- ============ FEATURES TAB ============ -->
<div class="screen" id="scr-feat"></div>

<nav id="nav">
  <button data-tab="main"><span class="ic">🛡️</span>Main</button>
  <button data-tab="skills"><span class="ic">🎯</span>Skills</button>
  <button data-tab="spells"><span class="ic">✨</span>Spells</button>
  <button data-tab="comp"><span class="ic">🐾</span>Allies</button>
  <button data-tab="inv"><span class="ic">🎒</span>Items</button>
  <button data-tab="feat"><span class="ic">📜</span>Features</button>
</nav>

<div id="toast"></div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modalBox"></div></div>

<script>

 Cleric:{n:2,from:["history","insight","medicine","persuasion","religion"]},

function allRaces(){return [...RACES,...(db.customRaces||[])];}
function findRace(name){const n=String(name||"").toLowerCase().trim();if(!n)return null;
  const L=allRaces();
  return L.find(r=>r.name.toLowerCase()===n)
    ||L.find(r=>r.name.toLowerCase().replace(/\s*\(.*\)/,"")===n)
    ||L.find(r=>r.name.toLowerCase().includes(n))||null;}

function saveCustomRace(i){
  const asi={};ABILITIES.forEach(a=>{const v=+$("#cr_"+a).value||0;if(v)asi[a]=v;});
  const traits=$("#cr_traits").value.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{
    const m=/^([^:—-]+)[:—-]\s*(.*)$/.exec(l);
    const t={name:(m?m[1]:l).trim(),desc:(m?m[2]:"").trim()};
    const fx=autoEffects(t.name,t.desc);if(fx.length)t.fx=fx;
    const rm=/resist(?:ance)?\s+(?:to\s+)?(\w+)/i.exec(t.name+" "+t.desc);
    if(!t.fx&&rm&&DMG_TYPES.includes(rm[1].toLowerCase()))t.fx=[{t:"resist."+rm[1].toLowerCase(),v:1}];
    return t;});
  const r={name:$("#cr_name").value.trim()||"Custom race",size:$("#cr_size").value,speed:+$("#cr_speed").value||30,asi,traits};
  if(i>=0)db.customRaces[i]=r;else db.customRaces.push(r);

function applyRace(c,prevRace){ /* returns number of traits added; queues choice prompts */
  if(prevRace!==undefined&&prevRace!==c.race)c.features=c.features.filter(f=>f.source!=="race");
  const r=findRace(c.race);if(!r)return 0;
  let added=0;
  if(c.edition!=="2024"&&r.asi&&!c.features.some(f=>f.source==="race"&&/^Ability Score Increase/.test(f.name))){
    c.features.push({name:"Ability Score Increase ("+r.name+")",source:"race",kind:"passive",
      desc:"Racial ability score increase — applied automatically to your scores.",
      effects:Object.entries(r.asi).map(([a,v])=>({t:"abl."+a,v}))});added++;}
  if(r.speed)c.speed=r.speed;
  if(r.size&&c.details)c.details.size=r.size;
  for(const t of r.traits||[]){
    if(c.features.some(f=>f.source==="race"&&f.name===t.name))continue;
    if(t.skill)c.skills[t.skill]=Math.max(c.skills[t.skill]||0,1);
    c.features.push({name:t.name,source:"race",desc:t.desc,uses:t.uses||0,recharge:t.recharge||"long",
      kind:t.kind,effects:(t.fx||[]).map(e=>({...e}))});added++;}

    if(r.choose.dragon)qPush(()=>raceDragonPrompt());
    if(r.choose.abl2)qPush(()=>raceAbl2Prompt(r.name));
    if(r.choose.skills)qPush(()=>raceSkillsPrompt(r.choose.skills));}
  return added;}

  if(/wisdom/i.test(f.desc||"")||c.classes.some(k=>k.name==="Monk"))return ["Unarmored Defense (WIS)",amod(c,"wis")];
  return null;}
function acBreakdown(c){
  const rows=[];
  if(c.acMode==="auto"){
    const ar=equippedArmor(c);
    if(ar&&ar.armor){const a=ar.armor;
      rows.push([ar.name+(ar.magic?" +"+ar.magic:""),(+a.base||10)+(+ar.magic||0)]);
      let dex=amod(c,"dex");
      if(a.dexCap===0)dex=0;else if(a.dexCap)dex=Math.min(dex,+a.dexCap);
      if(a.dexCap!==0)rows.push(["Dex"+(a.dexCap?" (max +"+a.dexCap+")":""),dex]);}
    else{rows.push(["Base",10],["Dex",amod(c,"dex")]);
      const ub=unarmoredBonus(c);if(ub&&ub[1])rows.push(ub);}
    const sh=equippedShield(c);
    if(sh)rows.push([sh.name+(sh.magic?" +"+sh.magic:""),2+(+sh.magic||0)]);}
  else rows.push(["Base AC (manual)",+c.ac||10]);
  bonusDetail(c,"ac").forEach(b=>rows.push([b.src,b.v]));
  return {rows,total:rows.reduce((s,r)=>s+r[1],0)};}
function acVal(c){return acBreakdown(c).total;}
/* ---- item enrichment: guess category, structure & bonuses from name/description ---- */
const ITEM_CATS=["Gear","Weapon","Ammo","Armor","Shield","Wondrous","Potion","Other"];
function enrichItem(it,force){
  if(!it.effects)it.effects=[];
  const nm=String(it.name||""),d=String(it.desc||"");
  if(!it.cat||force){
    if(/\b(arrows?|bolts?|sling bullets?|blowgun needles?|ammunition)\b/i.test(nm))it.cat="Ammo";
    else if(/^shield\b/i.test(nm)&&!/of missile/i.test(nm))it.cat="Shield";
    else if(/\bAC[: ]\s*\d|^AC\b/i.test(d)||/\b(plate|chain mail|chain shirt|scale mail|half plate|breastplate|studded leather|leather armor|hide armor|ring mail|splint|padded)\b/i.test(nm))it.cat="Armor";
    else if(/\d+d\d+[^.]*damage/i.test(d)||/\b(sword|axe|mace|bow|dagger|spear|hammer|flail|glaive|halberd|javelin|lance|maul|morningstar|pike|rapier|scimitar|sickle|trident|whip|blowgun|crossbow|sling|club|quarterstaff|greatclub|handaxe)\b/i.test(nm))it.cat="Weapon";
    else if(/potion|elixir/i.test(nm))it.cat="Potion";
    else it.cat=it.cat||"Gear";}
  if(it.magic===undefined){const m=/\+\s*([123])\b/.exec(nm);it.magic=m?+m[1]:0;}
  if(it.needsAttune===undefined)it.needsAttune=/requires attunement/i.test(d)||!!it.attunement;
  if(it.cat==="Armor"&&!it.armor){
    const m=/(\d+)\s*(\+\s*Dex modifier)?\s*(?:\(max\s*\+?(\d+)\))?/i.exec((/AC[: ]*([^.]*)/i.exec(d)||[])[1]||"");
    if(m)it.armor={base:+m[1],dexCap:m[2]?(m[3]?+m[3]:null):0};
    else it.armor={base:10,dexCap:null};
    if(/stealth disadvantage/i.test(d))it.armor.stealthDis=true;}
  if(it.cat==="Weapon"&&!it.weapon){
    const m=/(\d+d\d+)\s+(\w+)\s+damage/i.exec(d);
    it.weapon={dmg:m?m[1]:"1d6",type:m?m[2]:"",
      kind:/\b(ammunition|range \(?\d|bow|crossbow|sling|blowgun|dart)\b/i.test(d+" "+nm)&&!/thrown/i.test(d)?"ranged":"melee",
      finesse:/finesse/i.test(d)};
    const extra=/(?:plus|and) an extra (\d+d\d+)\s+(\w+)\s+damage|\+\s*(\d+d\d+)\s+(\w+)\s+damage/i.exec(d);
    if(extra)it.weapon.parts=[{d:it.weapon.dmg,t:it.weapon.type},{d:extra[1]||extra[3],t:extra[2]||extra[4]}];}
  if(it.weapon&&!(it.weapon.parts&&it.weapon.parts.length))
    it.weapon.parts=[{d:it.weapon.dmg||"1d6",t:it.weapon.type||""}];
  if(!it.effects.length){ /* known magic item bonuses */
    if(/^(ring|cloak) of protection/i.test(nm))it.effects=[{t:"ac",v:1},{t:"save.all",v:1}];
    const rm=/(?:of|to) (\w+) resistance|resistance to (\w+)/i.exec(nm);
    if(rm){const ty=(rm[1]||rm[2]||"").toLowerCase();if(DMG_TYPES.includes(ty))it.effects=[{t:"resist."+ty,v:1}];}
    if(/rod of the pact keeper|wand of the war mage/i.test(nm)&&it.magic)it.effects=[{t:"spell.atk",v:it.magic},...(/pact keeper/i.test(nm)?[{t:"spell.dc",v:it.magic}]:[])];
    if(/amulet of health/i.test(nm))it.desc=(it.desc||"")+"\n(Sets CON to 19 — adjust manually if needed.)";
    if(/bracers of defense/i.test(nm))it.effects=[{t:"ac",v:2,when:"unarmored"}];}
  return it;}
/* ---- feature kind / slot-cast detection ---- */
function featKind(f){
  if(f.kind)return f.kind;
  if(f.slotCast||f.uses)return "action";
  const d=(f.desc||"").toLowerCase();
  if(/as a bonus action|use a bonus action|bonus action,/.test(d))return "bonus";
  if(/your reaction|as a reaction/.test(d))return "reaction";
  if(/as an action|use your action|take the .* action|you can use your action/.test(d))return "action";
  return "passive";}
function isActiveFeat(f){return featKind(f)!=="passive";}
function detectSlotCast(desc){return /expend (one|a|an unexpended|any|1)?\s*(unexpended\s*)?(warlock\s*)?spell slot/i.test(desc||"");}
function autoEffects(name,desc){
  for(const k of KNOWN_EFFECTS){if(k.re.test(String(name||"")))return JSON.parse(JSON.stringify(k.e));}

  if(m){const ab=m[2].slice(0,3).toLowerCase();if(ABILITIES.includes(ab))return [{t:"save.all",v:"max(1,"+ab+")"}];}

/* ================== DICE ROLLER ================== */
function bigHtml(n){ /* total display; 14 gets fireworks 🎆 */
  if(+n!==14)return `<div class="big">${n}</div>`;
  const sp=[[-34,-20],[32,-24],[-38,16],[36,14],[0,-34],[-16,28],[18,26]]
    .map(([x,y],i)=>`<span class="sp" style="--dx:${x}px;--dy:${y}px;animation-delay:${(i*0.13).toFixed(2)}s">🎆</span>`).join("");
  return `<div class="big fw14">✨14✨${sp}</div>`;}
function logRoll(label,total,detail){
  if(!db.rollLog)db.rollLog=[];
  const entry={ts:Date.now(),label:String(label||""),total,detail:detail||""};
  db.rollLog.unshift(entry);
  if(db.rollLog.length>60)db.rollLog.length=60;
  save();return entry;}
function relogRoll(entry,total,detail){ /* the d20 toast lets you switch adv/dis after the roll — keep history truthful */
  if(!entry)return;
  entry.total=total;if(detail!==undefined)entry.detail=detail;save();}
let lastRoll=null;
function d20Roll(label,modifier,note,meta){
  const r1=rollDie(20),r2=rollDie(20);
  let extra=0,extraTxt=[];
  const c=cur();
  meta=meta||{};
  const kind=meta.kind||rollKind(label);
  if(c)buffD20Extras(c,kind).forEach(b=>{const r=rollExpr(b.dice);
    if(r){extra+=r.total;extraTxt.push(esc(b.name)+" "+esc(b.dice)+" ["+(r.total>=0?"+":"")+r.total+"]");}});
  const advice=c?rollAdvice(c,kind,meta):{dis:[],adv:[],notes:[]};
  /* advantage and disadvantage cancel out to a straight roll (PHB) */
  const start=(advice.dis.length&&advice.adv.length)?"normal"
    :advice.dis.length?"dis":advice.adv.length?"adv":"normal";
  lastRoll={label,modifier,r1,r2,note:note||"",extra,extraTxt:extraTxt.join(" · "),advice};
  lastRoll.entry=logRoll(label,r1+modifier+extra,"d20 "+r1+" "+fmt(modifier));
  showRoll(start);}
function showRoll(adv){
  const {label,modifier,r1,r2,note,extra,extraTxt}=lastRoll;
  const advice=lastRoll.advice||{dis:[],adv:[],notes:[]};
  let use=r1;if(adv==="adv")use=Math.max(r1,r2);if(adv==="dis")use=Math.min(r1,r2);
  relogRoll(lastRoll.entry,use+modifier+(extra||0),
    (adv==="adv"?"adv ":adv==="dis"?"dis ":"")+"d20 "+(adv==="normal"?use:r1+"/"+r2)+" "+fmt(modifier)+(extra?" "+fmt(extra):""));
  const crit=use===20?' <span class="good">CRIT!</span>':use===1?' <span class="warn">Nat 1</span>':"";
  const why=[];
  if(advice.dis.length&&advice.adv.length)
    why.push('<span class="dim">'+advice.adv.join(", ")+" vs "+advice.dis.join(", ")+" — they cancel, roll straight</span>");
  else if(advice.dis.length)why.push('<span class="warn">🔻 Disadvantage: '+advice.dis.join(", ")+"</span>");
  else if(advice.adv.length)why.push('<span class="good">🔺 Advantage: '+advice.adv.join(", ")+"</span>");
  advice.notes.forEach(n=>why.push('<span class="dim">⚠️ '+n+"</span>"));

/* ================== CLASS AUTOMATION ENGINE ================== */
function findBaseClass(ed,name){const lib=classLib(ed);return lib?lib.find(x=>!x.sub&&x.name===name):null;}
function findSubClass(ed,clsName,subName){if(!subName)return null;
  const t=normSub(subName);
  const cust=(db.customSubs||[]).find(x=>(x.edition==="any"||x.edition===ed)&&x.class===clsName&&sameSub(normSub(x.name),t));
  if(cust)return {name:cust.name,sub:clsName,features:cust.features};
  const bi=BUILTIN_SUBS.find(x=>(x.edition==="any"||x.edition===ed)&&x.class===clsName&&sameSub(normSub(x.name),t));
  if(bi)return {name:bi.name,sub:clsName,features:bi.features};
  const lib=classLib(ed);if(!lib)return null;
  return lib.find(x=>x.sub===clsName&&sameSub(normSub(x.name),t))||null;}
const PH_TEXT="⚠️ This subclass isn't in the free SRD, so its text can't be auto-filled. Tap ✏️ and paste this feature from your book — or import a subclass pack (⚙️ → SRD database) to fill it on every character automatically.";
function expectedClassFeatures(c){ // Map fid -> feature for this char's classes/levels
  const out=new Map();
  for(const k of c.classes){
    const base=findBaseClass(c.edition,k.name);
    const sub=findSubClass(c.edition,k.name,k.subclass);
    for(const src of [base,sub].filter(Boolean))for(const f of src.features){
      const lvls=f.levels&&f.levels.length?f.levels:[1];
      const minLv=lvls[0];
      if(minLv<=k.level){const fid=k.name+"|"+f.name;
        out.set(fid,{name:f.name,desc:(f.desc||"")+(lvls.length>1?"\n\n(Gained/improves at levels "+lvls.join(", ")+".)":""),cls:k.name,minLv,fid,uses:f.uses,recharge:f.recharge,fx:f.fx,kindHint:f.kindHint});}}
    /* guaranteed features (e.g. Paladin Channel Divinity) even if the library misses them */
    for(const f of EXTRA_CLASS_FEATURES[k.name]||[]){
      const fid=k.name+"|"+f.name;
      const already=[...out.values()].some(x=>x.cls===k.name&&x.name.toLowerCase()===f.name.toLowerCase());
      if(!already&&f.levels[0]<=k.level)
        out.set(fid,{name:f.name,desc:f.desc,cls:k.name,minLv:f.levels[0],fid});}
    /* Channel Divinity options from the catalog (auto-added; placeholder text if not in the SRD) */
    const cdCat=(CD_OPTIONS[c.edition]||{})[k.name];
    if(cdCat){
      const cdLv=k.name==="Cleric"?2:3;
      if(k.level>=cdLv){
        const names=[...(cdCat._base||[]),...(k.subclass?(cdCat[normSub(k.subclass)]||[]):[])];
        for(const nm of names){
          const full="Channel Divinity: "+nm;
          const already=[...out.values()].some(x=>x.cls===k.name&&(normCD(x.name)===normCD(full)||x.name.toLowerCase()===nm.toLowerCase()));
          if(!already)out.set(k.name+"|"+full,{name:full,desc:CD_PH,cls:k.name,minLv:cdLv,fid:k.name+"|"+full,ph:true,kindHint:"action"});}}}
    if(!sub&&k.subclass){ /* unknown subclass: scaffold placeholders at the right levels */
      const lvls=(SUBCLASS_LEVELS[c.edition]||{})[k.name]||[];
      for(const lv of lvls)if(lv<=k.level){
        const fid=k.name+"|"+k.subclass+"@"+lv;
        out.set(fid,{name:k.subclass+" — level "+lv+" feature",desc:PH_TEXT,cls:k.name,minLv:lv,fid,ph:true});}}}
  return out;}
function classUses(c,cls,name,desc,libUses,libRecharge){ /* class+edition aware uses */
  const ov=CLASS_USES[cls+"|"+name];
  if(ov)return {...(ov[c.edition]||ov["2014"])};
  /* CD options draw from the shared Channel Divinity pool — no own uses */
  if(/^channel divinity[:\s]/i.test(name)&&!/^channel divinity$/i.test(String(name).trim()))return {uses:0,recharge:"long"};
  if(libUses)return {uses:libUses,recharge:libRecharge||"long"};
  return autoUses(name,desc);}
function syncClassFeatures(c){ // additive; returns {added, stale[]}
  if(!SRD.classes&&!Object.keys(EXTRA_CLASS_FEATURES).some(k=>c.classes.some(x=>x.name===k)))return {added:0,stale:[],noLib:true};
  const expected=expectedClassFeatures(c);let added=0;
  for(const [fid,f] of expected){
    const ex=c.features.find(x=>x.fid===fid||(x.source==="class"&&x.cls===f.cls&&x.name===f.name));
    if(!ex){const au=classUses(c,f.cls,f.name,f.desc,f.uses,f.recharge);
      c.features.push({name:f.name,desc:f.desc,uses:au.uses,recharge:au.recharge,source:"class",fid,cls:f.cls,minLv:f.minLv,ph:f.ph||undefined,
        kind:f.kindHint||undefined,effects:f.fx?JSON.parse(JSON.stringify(f.fx)):autoEffects(f.name,f.desc),slotCast:detectSlotCast(f.desc)||undefined});added++;}
    else{if(!f.ph)ex.desc=f.desc; /* never overwrite text the user pasted into a placeholder */
      ex.minLv=f.minLv;ex.fid=fid;
      if(!ex.fxEdited){
        if(CLASS_USES[f.cls+"|"+f.name]){const au=classUses(c,f.cls,f.name,f.desc);ex.uses=au.uses;ex.recharge=au.recharge;}
        if(/^channel divinity[:\s]/i.test(ex.name)&&!/^channel divinity$/i.test(ex.name.trim())&&ex.uses)ex.uses=0; /* options use the shared pool */
        if(!(ex.effects||[]).length)ex.effects=f.fx?JSON.parse(JSON.stringify(f.fx)):autoEffects(ex.name,ex.desc);
        if(ex.slotCast===undefined&&detectSlotCast(ex.desc))ex.slotCast=true;}}}
  const stale=c.features.filter(x=>x.source==="class"&&x.fid&&!expected.has(x.fid));
  c.features.sort((a,b)=>(a.minLv??99)-(b.minLv??99));
  const spellsAdded=addSubclassSpells(c);
  return {added,stale,spellsAdded};}
function addSubclassSpells(c){ /* oath/domain spells -> always prepared, from the SRD library */
  const lib=spellsFor(c);if(!lib)return 0;let n=0;
  for(const k of c.classes){
    if(!k.subclass)continue;
    const t=SUBCLASS_SPELLS[k.name+"|"+normSub(k.subclass)];
    if(!t)continue;
    for(const lv in t){
      if(+lv>k.level)continue;
      for(const nm of t[lv]){
        if(c.spellcasting.spells.some(x=>x.name.toLowerCase()===nm.toLowerCase()))continue;
        const s=lib.find(x=>x.name.toLowerCase()===nm.toLowerCase());
        if(s){c.spellcasting.spells.push({name:s.name,level:s.level,school:s.school,time:s.time,range:s.range,components:s.components,
          duration:s.duration,conc:s.conc,ritual:s.ritual,prepared:true,always:true,desc:s.desc,higher:s.higher,source:"srd"});n++;}}}}
  return n;}
function syncClassFeaturesUI(c,quiet){
  const r=syncClassFeatures(c);
  if(r.noLib){if(!quiet)toast("Download the SRD library first (⚙️) for automatic class features");return;}
  if(r.stale.length&&confirm(`Remove ${r.stale.length} class feature(s) that no longer match your class/level/edition?\n(${r.stale.map(f=>f.name).slice(0,6).join(", ")}${r.stale.length>6?"…":""})`)){
    c.features=c.features.filter(x=>!r.stale.includes(x));}
  touch();
  if((r.added||r.spellsAdded)&&!quiet)toast("📜 "+(r.added?r.added+" class feature"+(r.added>1?"s":""):"")+(r.added&&r.spellsAdded?" + ":"")+(r.spellsAdded?r.spellsAdded+" oath/domain spell"+(r.spellsAdded>1?"s":"")+" (always prepared)":"")+" added");}
function applyClassBasics(c){ // saves, hit die, profs — from lib if present, else built-in tables
  const main=c.classes[0];if(!main)return;
  const base=findBaseClass(c.edition,main.name);
  const saves=(base&&base.saves.length?base.saves:SAVE_PROFS[main.name])||[];
  ABILITIES.forEach(a=>c.saveProf[a]=saves.includes(a));
  c.hitDice.die=(base&&base.hitDice)||HIT_DIE[main.name]||"d8";
  c.hitDice.total=totalLevel(c);
  const p=CLASS_PROFS[main.name];if(p){c.profs.armor=p.armor;c.profs.weapons=p.weapons;if(p.tools)c.profs.tools=p.tools;}}
function autoSlotsFromClasses(c){ // returns true if it set anything
  const single=c.classes.length===1;let cl=0,wl=0;
  const artUp=c.spellcasting.artUp!==false; /* RAW: Artificer rounds UP in multiclass */
  for(const k of c.classes){const t=CASTER_KIND[k.name];
    if(t==="full")cl+=k.level;
    else if(t==="half")cl+=(single||(k.name==="Artificer"&&artUp))?Math.ceil(k.level/2):Math.floor(k.level/2);
    else if(t==="pact")wl+=k.level;}
  const sc=c.spellcasting;
  if(cl>0){const table=FULL_CASTER_SLOTS[Math.min(20,cl)]||[];
    for(let l=1;l<=9;l++){sc.slots[l].max=table[l-1]||0;sc.slots[l].used=Math.min(sc.slots[l].used,sc.slots[l].max);}}
  else if(wl>0){for(let l=1;l<=9;l++)sc.slots[l].max=0;}
  if(wl>0){sc.pact.max=wl===1?1:wl<11?2:wl<17?3:4;sc.pact.level=Math.min(5,Math.ceil(wl/2));sc.pact.used=Math.min(sc.pact.used,sc.pact.max);}
  else sc.pact.max=0;
  const kinds={Warlock:"cha",Bard:"cha",Sorcerer:"cha",Paladin:"cha",Cleric:"wis",Druid:"wis",Ranger:"wis",Wizard:"int",Artificer:"int"};
  const caster=c.classes.find(k=>CASTER_KIND[k.name]);if(caster)sc.ability=kinds[caster.name]||sc.ability;
  return cl>0||wl>0;}

   <div class="grid2"><div><label>Alignment</label><input id="edAlign" value="${esc(c.alignment)}"></div>

   <div class="spacer"></div>
   <label>Rules edition</label><select id="edEdition">
     <option value="2014" ${c.edition==="2014"?"selected":""}>📕 5e (2014)</option>
     <option value="2024" ${c.edition==="2024"?"selected":""}>📗 5e (2024)</option></select>
   <hr><h3>Classes</h3><div class="dim" style="margin-bottom:6px">Multiclass supported — add rows. Features for new levels are added automatically on save.</div>
   <div id="classRows">${c.classes.map((k,i)=>classRow(k,i)).join("")}</div>
   <datalist id="subclassList">${CLASSES.filter(x=>x!=="Other").flatMap(cl=>subclassOptions(c.edition,cl)).map(n=>`<option value="${esc(n)}">`).join("")}</datalist>
   <button class="btn ghost small" onclick="addClassRow()">＋ Add class</button>
   <hr><button class="btn" style="width:100%" onclick="saveIdentity()">Save</button>`);}
function classRow(k,i){return `<div class="row" style="margin-bottom:8px" data-cls="${i}">
  <select class="clsName">${CLASSES.map(n=>`<option ${n===k.name?"selected":""}>${n}</option>`).join("")}</select>
  <input class="clsSub" placeholder="Subclass" list="subclassList" value="${esc(k.subclass||"")}">
  <input class="clsLv" type="number" min="1" max="20" value="${k.level}" style="max-width:70px">
  <button class="iconbtn" style="flex:none" onclick="this.parentElement.remove()">✕</button></div>`;}
function addClassRow(){$("#classRows").insertAdjacentHTML("beforeend",classRow({name:"Wizard",subclass:"",level:1},uid()));}
function saveIdentity(){const c=cur();
  const prev={levels:Object.fromEntries(c.classes.map(k=>[k.name,+k.level||0])),maxLv:maxSlotLv(c)};
  const prevRace=c.race,prevBg=c.background;
  c.name=$("#edName").value.trim()||"Unnamed";c.race=$("#edRace").value.trim();
  c.background=$("#edBg").value.trim();c.alignment=$("#edAlign").value.trim();c.xp=+$("#edXp").value||0;
  const edSel=$("#edEdition");const editionChanged=edSel&&edSel.value!==c.edition;
  if(edSel)c.edition=edSel.value;
  const rows=$$("#classRows [data-cls]");
  c.classes=rows.map(r=>({name:r.querySelector(".clsName").value,subclass:r.querySelector(".clsSub").value.trim(),level:Math.min(20,Math.max(1,+r.querySelector(".clsLv").value||1))}));
  if(!c.classes.length)c.classes=[{name:"Fighter",subclass:"",level:1}];
  const main=c.classes[0];
  const base=findBaseClass(c.edition,main.name);
  c.hitDice.die=(base&&base.hitDice)||HIT_DIE[main.name]||c.hitDice.die;
  c.hitDice.total=totalLevel(c);
  if(c.spellcasting.auto!==false)autoSlotsFromClasses(c);
  syncClassFeaturesUI(c,false);
  const rAdded=applyRace(c,prevRace);
  const bAdded=applyBackground(c,prevBg);
  if(rAdded||bAdded)toast("🧬 "+(rAdded?rAdded+" racial trait"+(rAdded>1?"s":""):"")+(rAdded&&bAdded?" + ":"")+(bAdded?"background":"")+" applied");
  touch();closeModal();renderTab();
  checkLevelUpChoices(c,prev);}

function grantedDefs(c){ /* from item/feature effects like resist.fire */
  const out=[];
  activeEffects(c).forEach(e=>{const m=/^(resist|immune|vuln)\.([a-z]+)$/.exec(e.t||"");
    if(m)out.push({s:m[1],t:m[2],src:e.src});});

function grantedCondImm(c){ /* from item/feature effects like condimm.Charmed */
  const out=[];
  activeEffects(c).forEach(e=>{const m=/^condimm\.(\w+)$/.exec(e.t||"");
    if(m)out.push({t:m[1],src:e.src});});
  return out;}
function grantedCustomDefs(c){ /* from item/feature effects like custom.resist with free text value */
  const out=[];
  activeEffects(c).forEach(e=>{const m=/^custom\.(resist|immune|vuln)$/.exec(e.t||"");
    if(m&&e.v)out.push({s:m[1],t:String(e.v),src:e.src});});
  return out;}
function defCount(c){const d=c.defenses||{dmg:{},condimm:[],custom:[]};
  /* dedupe against granted entries so the badge matches the list defSummary draws */
  const dmg=new Set(Object.keys(d.dmg||{}).map(t=>d.dmg[t]+"|"+t));
  grantedDefs(c).forEach(x=>dmg.add(x.s+"|"+x.t));
  const ci=new Set(d.condimm||[]);
  grantedCondImm(c).forEach(x=>ci.add(x.t));
  const cust=new Set((d.custom||[]).map(x=>x.s+"|"+x.t));
  grantedCustomDefs(c).forEach(x=>cust.add(x.s+"|"+x.t));
  return dmg.size+ci.size+cust.size;}
function defSummary(c){const d=c.defenses||{dmg:{},condimm:[],custom:[]};
  const g=grantedDefs(c);
  const rows=[];
  const gx=grantedCustomDefs(c);
  for(const key of ["resist","immune","vuln"]){
    const manual=DMG_TYPES.filter(t=>d.dmg[t]===key);
    const granted=[...new Set(g.filter(x=>x.s===key&&!manual.includes(x.t)).map(x=>x.t))].map(t=>t+' <span style="color:var(--gold)">✦</span>');
    const custom=(d.custom||[]).filter(x=>x.s===key).map(x=>"<i>"+esc(x.t)+"</i>");
    const grantedCustom=[...new Set(gx.filter(x=>x.s===key).map(x=>x.t))].map(t=>'<i>'+esc(t)+'</i> <span style="color:var(--gold)">✦</span>');
    const list=[...manual,...granted,...custom,...grantedCustom];
    if(list.length)rows.push(`<div style="margin:3px 0"><span style="color:${DEF_STATES[key][1]};font-weight:600">${DEF_STATES[key][0]}:</span> ${list.join(", ")}</div>`);}
  const manualCI=d.condimm||[];
  const grantedCI=[...new Set(grantedCondImm(c).filter(x=>!manualCI.includes(x.t)).map(x=>x.t))].map(t=>t+' <span style="color:var(--gold)">✦</span>');
  const ci=[...manualCI,...grantedCI];

/* ---- spells known / prepared capacity ---- */
function spellCap(c,cls,lv){ /* {spells,cantrips,mode} for a class at level lv */
  if(lv<1)return {spells:0,cantrips:0,mode:"known"};
  const ab={Bard:"cha",Sorcerer:"cha",Warlock:"cha",Paladin:"cha",Cleric:"wis",Druid:"wis",Ranger:"wis",Wizard:"int",Artificer:"int"}[cls];
  const cant=cantripsKnown(cls,lv);
  if(SPELLS_KNOWN[cls])return {spells:SPELLS_KNOWN[cls][Math.min(20,lv)]||0,cantrips:cant,mode:"known"};
  if(cls==="Cleric"||cls==="Druid"||cls==="Wizard")return {spells:Math.max(1,amod(c,ab)+lv),cantrips:cant,mode:"prepared"};
  if(cls==="Paladin"||cls==="Artificer")return lv>=(cls==="Paladin"?2:1)?{spells:Math.max(1,amod(c,ab)+Math.floor(lv/2)),cantrips:cant,mode:"prepared"}:{spells:0,cantrips:cant,mode:"prepared"};
  return {spells:0,cantrips:0,mode:"known"};}
function preparedInfo(c){
  const ks=(c.classes||[]).filter(x=>CASTER_KIND[x.name]).map(k=>[k,spellCap(c,k.name,k.level)])
    .filter(([,cap])=>cap.spells||cap.cantrips);
  if(!ks.length)return "";
  const sc=c.spellcasting;
  const known=sc.spells.filter(s=>s.level>0&&!s.always&&!s.fromItem).length;
  const prep=sc.spells.filter(s=>s.level>0&&!s.always&&!s.fromItem&&s.prepared).length;
  const cant=sc.spells.filter(s=>s.level===0&&!s.fromItem).length;
  const rows=ks.map(([k,cap])=>`${esc(k.name)} — ${cap.mode==="known"?"known":"prepared"} <b>${cap.mode==="known"?known:prep}/${cap.spells}</b>`
    +(cap.cantrips?` · cantrips <b>${cant}/${cap.cantrips}</b>`:""));
  /* spells aren't tagged with the class that granted them, so in a multiclass build each
     allowance is listed on its own rather than pretending we can split the list */
  return rows.join(" &nbsp;|&nbsp; ")+` <span class="dim">(${ks.length>1?"one allowance per class — spells aren't tagged by class":"suggestion"})</span>`;}
function maxSlotLv(c){const sc=c.spellcasting;let m=0;
  for(let l=1;l<=9;l++)if(sc.slots[l].max>0)m=l;
  if(sc.pact.max>0)m=Math.max(m,sc.pact.level);return m;}
/* ---- level-up: choose new spells ---- */
function checkLevelUpChoices(c,prev){ /* prev = {levels:{cls:lv}, maxLv} — queues ASI prompts & spell pickers */
  for(const k of c.classes){
    const pl=prev.levels[k.name]||0;
    if(k.level>pl){
      const asis=(ASI_LEVELS[k.name]||ASI_DEFAULT).filter(L=>L>pl&&L<=k.level);
      asis.forEach(L=>{
        const p=(c.plan||{})[k.name+"|"+L];
        if(p&&p.type==="asi"&&p.a1){
          c.abilities[p.a1]=Math.min(30,c.abilities[p.a1]+1);
          c.abilities[p.a2||p.a1]=Math.min(30,c.abilities[p.a2||p.a1]+1);
          touch();toast("🗺️ Planned ASI applied ("+k.name+" "+L+"): +1 "+p.a1.toUpperCase()+", +1 "+(p.a2||p.a1).toUpperCase());}
        else if(p&&p.type==="feat"&&p.feat){
          qPush(()=>{const f=[...FEATS,...(db.customFeats||[])].find(x=>x.name===p.feat);
            if(!f){asiPrompt(k.name,L);return;}
            toast("🗺️ Planned feat: "+esc(p.feat));
            if(f.choose)featChoices(f);else applyFeat(f,{});});}
        else qPush(()=>asiPrompt(k.name,L));});}}
  if(spellsFor(c))for(const k of c.classes){
    if(!CASTER_KIND[k.name])continue;
    const pl=prev.levels[k.name]||0;
    if(k.level<=pl)continue;
    const before=spellCap(c,k.name,pl),after=spellCap(c,k.name,k.level);
    const dS=Math.max(0,(after.spells||0)-(before.spells||0));
    const dC=Math.max(0,(after.cantrips||0)-(before.cantrips||0));
    const newLv=maxSlotLv(c)>(prev.maxLv||0);
    if(dS>0||dC>0||newLv)qPush(()=>spellPickModal(k.name,dS,dC,after.mode));}
  if(_mq.length)qNext();}

const SRD={spells2014:null,spells2024:null,items:null,classes:null}; window.SRD=SRD; // in-memory cache
function spellsFor(c){return (c&&c.edition==="2024")?SRD.spells2024:SRD.spells2014;}
function classLib(ed){if(!SRD.classes)return null;const l=SRD.classes[ed];return (l&&l.length)?l:null;}
function normSub(s){return String(s||"").toLowerCase()
  .replace(/^(path of the |path of |college of |circle of the |circle of |way of the |way of |warrior of the |warrior of |oath of the |oath of |school of |the )/,"")
  .replace(/( domain| patron| sorcery| bloodline)$/,"").trim();}
function sameSub(a,b){return !!a&&!!b&&(a===b||a.includes(b)||b.includes(a));}
function subclassOptions(ed,cls){ /* catalog + custom packs + SRD lib, deduped */
  const out=[],seen=new Set();
  const add=n=>{const k=normSub(n);if(k&&!seen.has(k)){seen.add(k);out.push(n);}};
  ((SUBCLASS_CATALOG[ed]||{})[cls]||[]).forEach(add);
  (db.customSubs||[]).filter(x=>(x.edition==="any"||x.edition===ed)&&x.class===cls).forEach(x=>add(x.name));
  (classLib(ed)||[]).filter(x=>x.sub===cls).forEach(x=>add(x.name));
  return out;}
function maxUses(c,f){ /* uses: number, or formula with prof, level, str…cha */
  if(!f||!f.uses)return 0;
  return Math.max(0,evalFormula(c,f.uses));}
function autoUses(name,desc){ /* best-effort detection of uses & recharge */
  const n=String(name||"").toLowerCase();
  for(const k in KNOWN_USES){const kk=k.toLowerCase();
    if(n===kk||n.startsWith(kk+" ")||n.startsWith(kk+":"))return {...KNOWN_USES[k]};}
  const d=String(desc||"").toLowerCase();
  if(/equal to your proficiency bonus/.test(d))return {uses:"prof",recharge:/short or long rest/.test(d)?"short":"long"};
  if(/(can't|cannot) use (it|this feature) again until you finish a short or long rest|finish a short or long rest before you can use/.test(d))return {uses:1,recharge:"short"};
  if(/(can't|cannot) use (it|this feature) again until you finish a long rest|finish a long rest before you can use/.test(d))return {uses:1,recharge:"long"};
  return {uses:0,recharge:"long"};}
function build2014Classes(feats){ /* 5e-bits feature list -> class library */
  const map=new Map();
  for(const f of feats){
    if(f.parent)continue; /* skip choice options like individual Fighting Styles */
    const cls=f.class?f.class.name:null;if(!cls||typeof f.level!=="number")continue;
    const subName=f.subclass?f.subclass.name:null;
    const key=cls+"|"+(subName||"");
    if(!map.has(key))map.set(key,{name:subName||cls,sub:subName?cls:null,saves:[],hitDice:null,caster:"NONE",feats:new Map()});
    const e=map.get(key);
    const desc=Array.isArray(f.desc)?f.desc.join("\n"):String(f.desc||"");
    if(e.feats.has(f.name)){const x=e.feats.get(f.name);if(!x.levels.includes(f.level))x.levels.push(f.level);}
    else e.feats.set(f.name,{name:f.name,desc,levels:[f.level]});}
  return [...map.values()].map(e=>({name:e.name,sub:e.sub,saves:e.saves,hitDice:e.hitDice,caster:e.caster,
    features:[...e.feats.values()].map(f=>({name:f.name,desc:f.desc,levels:f.levels.sort((a,b)=>a-b)}))}));}
function idb(){if(typeof indexedDB==="undefined")return Promise.reject(new Error("no idb"));
  return new Promise((res,rej)=>{const rq=indexedDB.open("grimoire_srd",1);
  rq.onupgradeneeded=()=>rq.result.createObjectStore("srd");
  rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);});}
async function idbGet(key){const d=await idb();return new Promise((res,rej)=>{
  const rq=d.transaction("srd").objectStore("srd").get(key);
  rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);});}
async function idbSet(key,val){const d=await idb();return new Promise((res,rej)=>{

  tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});}

function prettyCastTime(v,reaction){if(!v)return "";

          features:p.features.map(f=>({name:String(f.name||"Feature"),desc:String(f.desc||""),

            uses:f.uses??0,recharge:f.recharge==="short"?"short":"long"}))};
        if(!pack.features.length)throw new Error("no features");
        db.customSubs=db.customSubs.filter(x=>!(x.class===pack.class&&normSub(x.name)===normSub(pack.name)&&x.edition===pack.edition));

    rd.readAsText(file);};

   <div class="filter-pills" id="clsPills">${classes.map(k=>`<button class="pill ${k==="all"?"on":""}" onclick="browserFilter.cls='${k}';$$('#clsPills .pill').forEach(p=>p.classList.remove('on'));this.classList.add('on');renderSpellResults()">${k==="all"?"All classes":k}</button>`).join("")}</div></div>
   <div id="spResults"></div>`);
  renderSpellResults();}
function renderSpellResults(){const q=browserFilter.q.toLowerCase();
  const list=(spellsFor(cur())||[]).filter(s=>
    (browserFilter.lv==="all"||s.level===+browserFilter.lv)&&
    (browserFilter.cls==="all"||s.classes.some(c=>c.includes(browserFilter.cls)))&&
    (!q||s.name.toLowerCase().includes(q)))
    .sort((a,b)=>a.level-b.level||a.name.localeCompare(b.name));
  let html=`<div class="dim" style="margin:2px 0 4px">${list.length} spell${list.length===1?"":"s"}</div>`,lastLv=-1;
  if(!list.length)html="";
  for(const s of list){
    if(browserFilter.lv==="all"&&s.level!==lastLv){lastLv=s.level;
      html+=`<div class="dim" style="margin:12px 0 6px;font-weight:700;letter-spacing:.05em">${s.level===0?"CANTRIPS":"LEVEL "+s.level}</div>`;}
    html+=`<div class="li">
    <div class="li-head" onclick="this.parentElement.classList.toggle('open')">
      <div class="li-title">${esc(s.name)} ${s.conc?'<span class="tag c">C</span>':""}${s.ritual?'<span class="tag r">R</span>':""}
        <div class="li-sub">${s.level===0?"Cantrip":"Level "+s.level} · ${esc(s.school)}</div></div>
      <button class="btn small" onclick="event.stopPropagation();addSrdSpell('${jstr(s.name)}')">Add</button></div>
    <div class="li-body"><div class="dim">${esc(s.time)} · ${esc(s.range)} · ${esc(s.components)} · ${esc(s.duration)}<br>${esc(s.classes.join(", "))}</div>
      <p>${esc(s.desc).replace(/\n+/g,"</p><p>")}</p>${s.higher?`<p><b>At higher levels.</b> ${esc(s.higher)}</p>`:""}</div>
  </div>`;}
  $("#spResults").innerHTML=html||'<div class="empty">No matches</div>';}
function addSrdSpell(name){const s=(spellsFor(cur())||[]).find(x=>x.name===name);if(!s)return;
  const sc=cur().spellcasting;
  if(sc.spells.some(x=>x.name===s.name)){toast("Already known");return;}
  sc.spells.push({name:s.name,level:s.level,school:s.school,time:s.time,range:s.range,components:s.components,
    duration:s.duration,conc:s.conc,ritual:s.ritual,prepared:false,desc:s.desc,higher:s.higher,source:"srd"});
  touch();renderTab();toast("✨ "+esc(s.name)+" added");}
function openItemBrowser(){
  if(!SRD.items){openModal(`<h2>Item library ${XBTN}</h2><p class="dim">The SRD library isn't downloaded yet.</p>
    <span id="srdProgress" class="dim"></span><div class="spacer"></div>
    <button class="btn" style="width:100%" onclick="syncSrd().then(()=>{closeModal();openItemBrowser()})">⬇️ Download SRD library</button>`);return;}
  browserFilter={q:"",cat:"all"};
  const cats=["all","Weapon","Armor","Shield","Gear","Magic"];
  openModal(`<h2>Item library ${XBTN}</h2>
   <div class="searchwrap"><input id="itq" placeholder="🔍 Search ${SRD.items.length} items…" oninput="browserFilter.q=this.value;debounced(renderItemResults)">
   <div class="filter-pills" id="catPills">${cats.map(k=>`<button class="pill ${k==="all"?"on":""}" onclick="browserFilter.cat='${k}';$$('#catPills .pill').forEach(p=>p.classList.remove('on'));this.classList.add('on');renderItemResults()">${k==="all"?"All":k}</button>`).join("")}</div></div>
   <div id="itResults"></div>`);
  renderItemResults();}
function renderItemResults(){const q=browserFilter.q.toLowerCase();
  const list=SRD.items.filter(it=>
    (browserFilter.cat==="all"||it.cat.startsWith(browserFilter.cat))&&
    (!q||it.name.toLowerCase().includes(q)));
  $("#itResults").innerHTML=(list.length?`<div class="dim" style="margin:2px 0 4px">${list.length} item${list.length===1?"":"s"}</div>`:"")+list.map(it=>`<div class="li">
    <div class="li-head" onclick="this.parentElement.classList.toggle('open')">
      <div class="li-title">${esc(it.name)}<div class="li-sub">${esc(it.cat)}${it.cost?" · "+esc(it.cost):""}${it.weight?" · "+it.weight+" lb":""}</div></div>
      <button class="btn small" onclick="event.stopPropagation();addSrdItem('${jstr(it.name)}')">Add</button></div>
    <div class="li-body"><p>${esc(it.desc||"—").replace(/\n+/g,"</p><p>")}</p></div>
  </div>`).join("")||'<div class="empty">No matches</div>';}
function addSrdItem(name){const it=SRD.items.find(x=>x.name===name);if(!it)return;
  const inv=cur().inventory;
  const ex=inv.items.find(x=>x.name===it.name);
  if(ex){ex.qty=(+ex.qty||1)+1;}
  else{const ni={id:uid(),name:it.name,qty:1,weight:it.weight||0,cost:it.cost||"",equipped:false,attuned:false,desc:it.desc||"",notes:"",attunement:it.attunement};
    if(it.cat==="Weapon"&&it.weapon){ni.cat="Weapon";ni.weapon={...it.weapon};}
    if((it.cat==="Armor"||it.cat==="Shield")&&it.armor!==undefined){ni.cat=it.cat;ni.armor=it.armor?{...it.armor}:undefined;}
    enrichItem(ni,false);delete ni.attunement;
    inv.items.push(ni);}
  touch();renderTab();toast("🎒 "+esc(it.name)+" added — equip it to apply AC/attacks");}


/* ================== SELF-TESTS ==================
   Regression harness for the pure logic. Runs only with ?selftest=1 in the URL,
   never touches localStorage, and restores your real characters when it finishes.
   Costs the shipped app nothing — it is one string comparison at startup. */
function runSelfTests(){
  const results=[];
  const t=(name,fn)=>{try{fn();results.push({name,ok:true});}
    catch(e){results.push({name,ok:false,msg:(e&&e.message)||String(e)});}};
  const eq=(a,b,m)=>{if(a!==b)throw new Error((m?m+": ":"")+"expected "+JSON.stringify(b)+", got "+JSON.stringify(a));};
  const ok=(v,m)=>{if(!v)throw new Error(m||"expected truthy");};
  const rng=(a,lo,hi,m)=>{if(!(a>=lo&&a<=hi))throw new Error((m?m+": ":"")+a+" not in ["+lo+"–"+hi+"]");};

  /* isolate: snapshot the real db and stub every side effect */
  const snapshot=JSON.stringify(db);
  const real={save,toast,openModal,closeModal,renderTab,confirm:window.confirm,prompt:window.prompt};
  save=()=>{};toast=()=>{};openModal=()=>{};closeModal=()=>{};renderTab=()=>{};
  window.confirm=()=>true;window.prompt=()=>null;
  const mk=mut=>{const c=migrate(newCharacter());db.characters=[c];db.currentId=c.id;if(mut)mut(c);return c;};

  try{
  /* ---- dice ---- */
  t("d20 stays in range",()=>{for(let i=0;i<400;i++)rng(rollDie(20),1,20);});
  t("d1 always rolls 1",()=>eq(rollDie(1),1));
  t("every face of a d6 is reachable",()=>{const seen=new Set();
    for(let i=0;i<600;i++)seen.add(rollDie(6));eq(seen.size,6);});
  t("rollExpr parses 2d6+3",()=>{const r=rollExpr("2d6+3");ok(r);rng(r.total,5,15);});
  t("rollExpr handles a negative modifier",()=>{const r=rollExpr("1d4-1");ok(r);rng(r.total,0,3);});
  t("rollExpr rejects text with no dice",()=>eq(rollExpr("no dice here"),null));

  /* ---- core maths ---- */
  t("ability modifiers",()=>{eq(mod(10),0);eq(mod(11),0);eq(mod(20),5);eq(mod(7),-2);eq(mod(1),-5);});
  t("proficiency bonus by level",()=>{const c=mk();
    [[1,2],[4,2],[5,3],[9,4],[13,5],[17,6],[20,6]].forEach(([lv,pb])=>{
      c.classes[0].level=lv;eq(profBonus(c),pb,"level "+lv);});});
  t("formula evaluation",()=>{const c=mk(x=>{x.classes[0].level=8;x.abilities.cha=18;});
    eq(evalFormula(c,3),3);eq(evalFormula(c,"prof"),3);eq(evalFormula(c,"level"),8);
    eq(evalFormula(c,"2*level"),16);eq(evalFormula(c,"max(1,cha)"),4);
    eq(evalFormula(c,"level>=17?6:level>=12?5:level>=6?4:level>=3?3:2"),4);});
  t("formulas cannot run arbitrary code",()=>{const c=mk();
    eq(evalFormula(c,"alert(1)"),0);eq(evalFormula(c,"window"),0);eq(evalFormula(c,"fetch('x')"),0);});
  t("escaping blocks HTML injection",()=>{
    eq(esc("<img src=x onerror=alert(1)>"),"&lt;img src=x onerror=alert(1)&gt;");
    eq(esc("Tom's"),"Tom&#39;s");});

  /* ---- skills & saves ---- */
  t("skill modifier: proficiency, expertise, jack of all trades",()=>{
    const c=mk(x=>{x.classes[0].level=5;x.abilities.dex=16;});
    eq(skillMod(c,"stealth"),3,"untrained");
    c.skills.stealth=1;eq(skillMod(c,"stealth"),6,"proficient");
    c.skills.stealth=2;eq(skillMod(c,"stealth"),9,"expertise");
    c.skills.stealth=0;c.jack=true;eq(skillMod(c,"stealth"),4,"jack of all trades");});
  t("saving throws add proficiency",()=>{const c=mk(x=>{x.classes[0].level=5;x.abilities.con=14;});
    eq(saveMod(c,"con"),2);c.saveProf.con=true;eq(saveMod(c,"con"),5);});

  /* ---- effects engine ---- */
  t("effects stack and '.all' reaches every member",()=>{
    const c=mk(x=>{x.classes[0].level=5;x.abilities.cha=16;
      x.features.push({name:"Aura of Protection",effects:[{t:"save.all",v:"max(1,cha)"}]},
                      {name:"Test ring",effects:[{t:"save.dex",v:1}]});});
    eq(bonusFor(c,"save.dex"),4,"aura 3 + specific 1");
    eq(bonusFor(c,"save.con"),3,"aura only");});
  t("item effects need the item equipped and attuned",()=>{
    const c=mk(x=>{x.inventory.items.push({id:"i1",name:"Cloak of Protection",cat:"Wondrous",qty:1,
      needsAttune:true,equipped:false,attuned:false,effects:[{t:"ac",v:1},{t:"save.all",v:1}]});});
    eq(bonusFor(c,"save.str"),0,"unequipped");
    c.inventory.items[0].equipped=true;eq(bonusFor(c,"save.str"),0,"equipped, not attuned");
    c.inventory.items[0].attuned=true;eq(bonusFor(c,"save.str"),1,"equipped and attuned");});
  t("ability-score effects feed through to the modifier",()=>{
    const c=mk(x=>{x.abilities.str=16;x.features.push({name:"Belt",effects:[{t:"abl.str",v:2}]});});
    eq(abl(c,"str"),18);eq(amod(c,"str"),4);});
  t("Tough raises max HP by 2 per level",()=>{
    const c=mk(x=>{x.classes[0].level=6;x.hp.max=40;
      x.features.push({name:"Tough",effects:[{t:"hpmax",v:"2*level"}]});});
    eq(maxHP(c),52);});

  /* ---- armour class ---- */
  t("AC: manual mode uses the typed number",()=>{const c=mk(x=>{x.acMode="manual";x.ac=17;});eq(acVal(c),17);});
  t("AC: unarmored is 10 + Dex",()=>{const c=mk(x=>{x.acMode="auto";x.abilities.dex=16;});eq(acVal(c),13);});
  t("AC: medium armour caps Dex and a shield adds 2",()=>{
    const c=mk(x=>{x.acMode="auto";x.abilities.dex=18;
      x.inventory.items.push({id:"a",name:"Half Plate",cat:"Armor",qty:1,equipped:true,armor:{base:15,dexCap:2},effects:[]},
                             {id:"s",name:"Shield",cat:"Shield",qty:1,equipped:true,effects:[]});});
    eq(acVal(c),19,"15 + 2 Dex + 2 shield");});
  t("AC: heavy armour ignores Dex",()=>{
    const c=mk(x=>{x.acMode="auto";x.abilities.dex=18;
      x.inventory.items.push({id:"a",name:"Plate",cat:"Armor",qty:1,equipped:true,armor:{base:18,dexCap:0},effects:[]});});
    eq(acVal(c),18);});
  t("AC: Unarmored Defense (Barbarian)",()=>{
    const c=mk(x=>{x.acMode="auto";x.classes=[{name:"Barbarian",subclass:"",level:3}];
      x.abilities.dex=14;x.abilities.con=16;
      x.features.push({name:"Unarmored Defense",desc:"AC equals 10 + Dex + your Constitution modifier",effects:[]});});
    eq(acVal(c),15,"10 + 2 Dex + 3 Con");});
  t("AC: the Defense style only counts while armoured",()=>{
    const c=mk(x=>{x.acMode="auto";x.abilities.dex=10;
      x.features.push({name:"Fighting Style: Defense",effects:[{t:"ac",v:1,when:"armored"}]});});
    eq(acVal(c),10,"no armour: style inactive");
    c.inventory.items.push({id:"a",name:"Chain Shirt",cat:"Armor",qty:1,equipped:true,armor:{base:13,dexCap:2},effects:[]});
    eq(acVal(c),14,"13 + 0 Dex + 1 Defense");});

  /* ---- spell slots ---- */
  t("slots: full caster table",()=>{const c=mk(x=>{x.classes=[{name:"Wizard",subclass:"",level:5}];});
    autoSlotsFromClasses(c);const sl=c.spellcasting.slots;
    eq(sl[1].max,4);eq(sl[2].max,3);eq(sl[3].max,2);eq(sl[4].max,0);});
  t("slots: a single-classed half caster rounds up",()=>{
    const c=mk(x=>{x.classes=[{name:"Paladin",subclass:"",level:5}];});
    autoSlotsFromClasses(c);const sl=c.spellcasting.slots;
    eq(sl[1].max,4);eq(sl[2].max,2);eq(sl[3].max,0);eq(c.spellcasting.ability,"cha");});
  t("slots: warlocks use pact magic, not normal slots",()=>{
    const c=mk(x=>{x.classes=[{name:"Warlock",subclass:"",level:5}];});
    autoSlotsFromClasses(c);
    eq(c.spellcasting.slots[1].max,0);eq(c.spellcasting.pact.max,2);eq(c.spellcasting.pact.level,3);});
  t("slots: multiclass halves round down",()=>{
    const c=mk(x=>{x.classes=[{name:"Wizard",subclass:"",level:4},{name:"Cleric",subclass:"",level:1},{name:"Paladin",subclass:"",level:3}];});
    autoSlotsFromClasses(c); /* 4 + 1 + floor(3/2) = caster level 6 */
    eq(c.spellcasting.slots[3].max,3);eq(c.spellcasting.slots[4].max,0);});
  t("casting spends the lowest slot at or above the level",()=>{
    const c=mk(x=>{x.classes=[{name:"Wizard",subclass:"",level:5}];});
    autoSlotsFromClasses(c);c.spellcasting.slots[1].used=4;
    castSpell(1,null);
    eq(c.spellcasting.slots[2].used,1,"upcast into level 2");
    eq(c.spellcasting.slots[1].used,4,"level 1 untouched");});
  t("declining a concentration swap costs no slot",()=>{
    const c=mk(x=>{x.classes=[{name:"Wizard",subclass:"",level:5}];});
    autoSlotsFromClasses(c);c.concentration="Haste";
    window.confirm=()=>false;
    castSpell(1,"Fly");
    eq(c.spellcasting.slots[1].used,0,"no slot spent");
    eq(c.concentration,"Haste","old spell kept");
    window.confirm=()=>true;
    castSpell(1,"Fly");
    eq(c.spellcasting.slots[1].used,1);eq(c.concentration,"Fly");});
  t("spells known / prepared capacity",()=>{
    const c=mk(x=>{x.abilities.int=16;x.abilities.cha=16;});
    eq(spellCap(c,"Bard",5).spells,8);eq(spellCap(c,"Bard",5).mode,"known");
    const w=spellCap(c,"Wizard",5);eq(w.mode,"prepared");eq(w.spells,8,"Int 3 + level 5");});

  /* ---- damage, healing, concentration ---- */
  t("temporary HP absorbs damage first",()=>{const c=mk(x=>{x.hp={max:20,current:20,temp:5};});
    applyDamage(3);eq(c.hp.temp,2);eq(c.hp.current,20);
    applyDamage(6);eq(c.hp.temp,0);eq(c.hp.current,16);});
  t("the − button and the Damage prompt behave identically",()=>{
    const a=mk(x=>{x.hp={max:20,current:20,temp:2};});
    tallyHp("c",-1);commitHp();eq(a.hp.temp,1,"− button eats temp HP");
    const b=mk(x=>{x.hp={max:20,current:20,temp:2};});
    applyDamage(1);eq(b.hp.temp,1,"prompt does the same");});
  t("the − button also triggers the concentration save",()=>{
    const c=mk(x=>{x.hp={max:20,current:10,temp:0};x.concentration="Bless";});

    eq(c.hp.current,9);});
  t("the − button ends concentration when it drops you to 0",()=>{
    const c=mk(x=>{x.hp={max:20,current:1,temp:0};x.concentration="Bless";x.activeBuffs=["Bless"];});
    tallyHp("c",-1);commitHp();

    applyDamage(9);

  t("toggling a concentration buff off drops concentration",()=>{

  t("roll labels are classified correctly",()=>{

  /* ---- rests ---- */
  t("long rest restores HP, slots, uses and half the hit dice",()=>{

  t("short rest restores pact slots and short-rest features only",()=>{
    const c=mk(x=>{x.classes=[{name:"Warlock",subclass:"",level:5}];
      x.features.push({name:"Second Wind",uses:1,recharge:"short",usesLeft:0,effects:[]},
                      {name:"Rage",uses:3,recharge:"long",usesLeft:0,effects:[]});});
    autoSlotsFromClasses(c);c.spellcasting.pact.used=2;
    shortRest();
    eq(c.spellcasting.pact.used,0);

  t("'regain 1 per short rest' regains exactly one",()=>{
    const c=mk(x=>{x.features.push({name:"Channel Divinity",uses:3,recharge:"short1",usesLeft:0,effects:[]});});
    shortRest();eq(c.features[0].usesLeft,1);
    shortRest();eq(c.features[0].usesLeft,2);});

  /* ---- attacks & ammunition ---- */
  t("to-hit adds ability, proficiency and magic",()=>{
    const c=mk(x=>{x.classes[0].level=5;x.abilities.str=18;
      x.attacks.push({name:"Longsword",ability:"str",proficient:true,kind:"melee",magic:1,
        addAbility:true,bonusMisc:0,dmgParts:[{d:"1d8",t:"slashing"}]});});
    eq(attackBonus(c,c.attacks[0]),8,"4 Str + 3 prof + 1 magic");
    eq(attackDmgExtra(c,c.attacks[0]),5,"4 Str + 1 magic");});
  t("the Archery style only helps ranged attacks",()=>{
    const c=mk(x=>{x.abilities.dex=14;x.abilities.str=14;
      x.features.push({name:"Fighting Style: Archery",effects:[{t:"atk.ranged",v:2}]});
      x.attacks.push({name:"Bow",ability:"dex",proficient:false,kind:"ranged",dmgParts:[]},
                     {name:"Club",ability:"str",proficient:false,kind:"melee",dmgParts:[]});});
    eq(attackBonus(c,c.attacks[0]),4,"2 Dex + 2 Archery");

    rollAttackHit(0);eq(c.inventory.items[0].qty,1);

    eq(db.rollLog[0].total,r1+3,"normal");
    showRoll("adv");eq(db.rollLog[0].total,Math.max(r1,r2)+3,"advantage rewrites the entry");
    showRoll("dis");eq(db.rollLog[0].total,Math.min(r1,r2)+3,"disadvantage rewrites the entry");
    eq(db.rollLog.length,1,"one entry, not three");});

  t("deleting a feature offers to take its grants with it",()=>{
    const c=mk(x=>{x.features.push({name:"Find Familiar",effects:[],grants:{spells:[],summons:[
      {name:"Owl",kind:"familiar",ac:11,hpMax:1,speed:5,conc:false,attacks:[]}]}});});
    summonFromFeature(0,0);
    eq(c.companions.length,1);
    deleteFeature(0); /* confirm is stubbed to true */
    eq(c.features.length,0);eq(c.companions.length,0,"the owl went with it");});

  /* ---- favourites ---- */
  t("pinning a feature puts it above everything else",()=>{
    const c=mk(x=>{x.features.push({name:"Zeta Passive",effects:[]},{name:"Alpha Pinned",effects:[]});});
    toggleFav(1);
    eq(c.features[1].fav,true);
    renderFeat();
    const html=document.getElementById("scr-feat").innerHTML;
    ok(/PINNED/.test(html),"pinned section drawn");
    ok(html.indexOf("Alpha Pinned")<html.indexOf("Zeta Passive"),"pinned entry comes first");
    toggleFav(1);
    eq(c.features[1].fav,false);});
  t("an active feature can be pinned too, not just passives",()=>{
    const c=mk(x=>{x.features.push({name:"Second Wind",uses:1,recharge:"short",effects:[],desc:"as a bonus action"});});
    eq(isActiveFeat(c.features[0]),true);
    toggleFav(0);
    renderFeat();
    ok(/PINNED/.test(document.getElementById("scr-feat").innerHTML));});
  t("a pin survives a class resync",()=>{
    const c=mk(x=>{x.features.push({name:"Aura",source:"class",fid:"Paladin|Aura",cls:"Paladin",minLv:6,fav:true,effects:[]});});
    syncClassFeatures(c);
    eq(c.features.find(f=>f.name==="Aura").fav,true);});
  t("a pin survives editing the feature",()=>{
    const c=mk(x=>{x.features.push({name:"Aura of Courage",source:"class",fid:"Paladin|Aura of Courage",
      cls:"Paladin",minLv:10,fav:true,effects:[],desc:"You and allies can't be frightened."});});
    openModal=real.openModal;
    try{editFeature(0);saveFeature(0);}          /* full editor round-trip: the object is rebuilt */
    finally{real.closeModal();openModal=()=>{};}
    eq(c.features[0].fav,true,"still pinned after saving");
    eq(c.features[0].fid,"Paladin|Aura of Courage","class identity kept too");
    eq(c.features[0].name,"Aura of Courage");});

  t("a card the player expanded survives a re-render",()=>{
    const c=mk(x=>{x.features.push({name:"Conjure Animals",effects:[],desc:"text",
      grants:{spells:["Something"],summons:[]}});});
    renderFeat();
    const sel='#scr-feat .li[data-k="f:Conjure Animals"]';
    document.querySelector(sel).classList.add("open");
    renderFeat(); /* acting on a feature re-renders the tab */
    ok(document.querySelector(sel).classList.contains("open"),
       "the card holding the buttons you are pressing stays open");
    document.querySelector(sel).classList.remove("open");
    renderFeat();
    ok(!document.querySelector(sel).classList.contains("open"),"and a closed card stays closed");});


  /* ---- hiding a feature you're done reading ---- */
  t("hiding moves a feature out of the list but keeps it working",()=>{
    const c=mk(x=>{x.classes[0].level=5;x.abilities.cha=16;
      x.features.push({name:"Aura of Protection",effects:[{t:"save.all",v:"max(1,cha)"}]});});
    const before=saveMod(c,"dex");
    toggleHidden(0);
    eq(c.features[0].hidden,true);
    eq(saveMod(c,"dex"),before,"a hidden feature still grants its bonus");
    renderFeat();
    const html=document.getElementById("scr-feat").innerHTML;
    ok(/HIDDEN \(1\)/.test(html),"counted in its own section");
    ok(!/PASSIVE/.test(html),"and gone from the passive list");});
  t("hidden features keep their uses and grants",()=>{
    const c=mk(x=>{x.features.push({name:"Second Wind",uses:1,recharge:"short",usesLeft:0,hidden:true,effects:[]});});
    shortRest();
    eq(c.features[0].usesLeft,1,"a rest still recharges it");});
  t("pinning and hiding are mutually exclusive",()=>{
    const c=mk(x=>{x.features.push({name:"Darkvision",effects:[]});});
    toggleFav(0);eq(c.features[0].fav,true);
    toggleHidden(0);
    eq(c.features[0].hidden,true);eq(c.features[0].fav,false,"hiding un-pins");
    toggleFav(0);
    eq(c.features[0].fav,true);eq(c.features[0].hidden,false,"pinning un-hides");});
  t("hidden features reveal on demand and survive editing",()=>{
    const c=mk(x=>{x.features.push({name:"Druidic",desc:"secret language",hidden:true,effects:[]});});
    hiddenOpen=false;renderFeat();
    ok(!/Druidic/.test(document.getElementById("scr-feat").innerHTML),"collapsed by default");
    hiddenOpen=true;renderFeat();
    ok(/Druidic/.test(document.getElementById("scr-feat").innerHTML),"revealed when opened");
    hiddenOpen=false;
    openModal=real.openModal;
    try{editFeature(0);saveFeature(0);}finally{real.closeModal();openModal=()=>{};}
    eq(c.features[0].hidden,true,"still hidden after an edit");});

  /* ---- the grants sub-menus ---- */
  t("opening a sub-menu does not lose what you typed",()=>{
    const keep=SRD.spells2014;
    SRD.spells2014=[{name:"Misty Step",level:2,school:"conjuration",time:"1 bonus action",range:"Self",
      components:"V",duration:"Instantaneous",conc:false,ritual:false,desc:"teleport",higher:"",classes:["Druid"]}];
    const c=mk(x=>{x.edition="2014";x.features.push({name:"Old name",desc:"old desc",effects:[]});});
    openModal=real.openModal;
    try{
      editFeature(0);
      document.getElementById("ft_name").value="Conjure Woodland Beings";
      document.getElementById("ft_desc").value="Summons fey creatures.";
      ftPickSpell();                    /* the editor's DOM is replaced by the picker */
      ftAddSpell("Misty Step");
      editFeature(_ftDraft.i,true);     /* back */
      eq(document.getElementById("ft_name").value,"Conjure Woodland Beings","the name you typed survived");
      eq(document.getElementById("ft_desc").value,"Summons fey creatures.","so did the description");
      ok(/Misty Step/.test(document.getElementById("modalBox").innerHTML),"and the spell is listed");
      saveFeature(0);
    }finally{real.closeModal();openModal=()=>{};SRD.spells2014=keep;}
    eq(c.features[0].name,"Conjure Woodland Beings");
    eq(gsName(c.features[0].grants.spells[0]),"Misty Step");});
  t("removing a grant also keeps your typing",()=>{
    const c=mk(x=>{x.features.push({name:"Boon",effects:[],grants:{spells:["A","B"],summons:[]}});});
    openModal=real.openModal;
    try{
      editFeature(0);
      document.getElementById("ft_name").value="Renamed boon";
      ftRemoveSpell(0);
      eq(document.getElementById("ft_name").value,"Renamed boon","name kept while the list re-drew");
      eq(_ftDraft.grants.spells.length,1);
      eq(gsName(_ftDraft.grants.spells[0]),"B","the right one was removed");
    }finally{real.closeModal();openModal=()=>{};}});
  t("a granted spell can be written by hand and keeps its details",()=>{
    const c=mk(x=>{x.features.push({name:"Pact Boon",effects:[]});});
    openModal=real.openModal;
    try{
      editFeature(0);
      ftCustomSpell(-1);
      document.getElementById("fcs_name").value="Thornwhip Surge";
      document.getElementById("fcs_lv").value="3";
      document.getElementById("fcs_desc").value="A lash of bramble.";
      document.getElementById("fcs_conc").checked=true;
      ftCustomSpellSave(-1);
      saveFeature(0);
    }finally{real.closeModal();openModal=()=>{};}
    const sp=c.features[0].grants.spells[0];
    eq(gsCustom(sp),true,"stored as a full definition, not a bare name");
    eq(sp.level,3);eq(sp.conc,true);
    grantSpells(0);
    const on=c.spellcasting.spells[0];
    eq(on.name,"Thornwhip Surge");eq(on.level,3,"lands with its real level");
    eq(on.conc,true);eq(on.always,true);eq(on.fromFeature,"Pact Boon");
    ok(!/isn't in the downloaded SRD/.test(on.desc),"not a fill-in stub");});
  t("plain SRD names still work alongside custom ones",()=>{
    const keep=SRD.spells2014;
    SRD.spells2014=[{name:"Moonbeam",level:2,school:"evocation",time:"1 action",range:"120 ft",
      components:"V,S,M",duration:"1 minute",conc:true,ritual:false,desc:"a beam",higher:"",classes:["Druid"]}];
    try{
      const c=mk(x=>{x.edition="2014";x.features.push({name:"Circle Spells",effects:[],
        grants:{spells:["Moonbeam",{name:"Homebrew Bolt",level:1,conc:false,desc:"zap"}],summons:[]}});});
      grantSpells(0);
      eq(c.spellcasting.spells.length,2);
      eq(c.spellcasting.spells.find(x=>x.name==="Moonbeam").level,2,"name resolved from the library");
      eq(c.spellcasting.spells.find(x=>x.name==="Homebrew Bolt").level,1,"custom used as written");
    }finally{SRD.spells2014=keep;}});
  t("a creature is described in its own menu and lands intact",()=>{
    const c=mk(x=>{x.features.push({name:"Find Familiar",effects:[]});});
    openModal=real.openModal;
    try{
      editFeature(0);
      ftEditSummon(-1);
      document.getElementById("fsm_name").value="Pseudodragon";
      document.getElementById("fsm_kind").value="familiar";
      document.getElementById("fsm_ac").value="13";
      document.getElementById("fsm_hp").value="7";
      document.getElementById("fsm_init").value="2";
      const row=document.querySelector("#compAtks .compatk");
      row.querySelector(".caN").value="Sting";row.querySelector(".caH").value="4";row.querySelector(".caD").value="1d4+2";
      ftSummonSave(-1);
      saveFeature(0);
    }finally{real.closeModal();openModal=()=>{};}
    const g=c.features[0].grants.summons[0];
    eq(g.name,"Pseudodragon");eq(g.kind,"familiar");eq(g.ac,13);eq(g.hpMax,7);eq(g.init,2);
    eq(g.attacks[0].dmg,"1d4+2");
    summonFromFeature(0,0);
    eq(c.companions[0].name,"Pseudodragon");
    eq(c.companions[0].attacks[0].hit,4);});
  t("a feature with no grants stores none",()=>{
    const c=mk(x=>{x.features.push({name:"Plain",effects:[]});});
    openModal=real.openModal;
    try{editFeature(0);saveFeature(0);}finally{real.closeModal();openModal=()=>{};}
    eq(c.features[0].grants,undefined,"no empty grants object left behind");});
  t("migrate accepts both grant shapes",()=>{
    const c=migrate({name:"X",classes:[{name:"Druid",level:3}],
      features:[{name:"F",grants:{spells:["Moonbeam",{name:"Custom",level:2},"",null,{}],summons:[{name:"Wolf"},null]}}]});
    eq(c.features[0].grants.spells.length,2,"blank and malformed entries dropped");
    eq(c.features[0].grants.summons.length,1);});

  /* ---- the status strip ---- */
  t("the status bar shows transient state and hides when there is none",()=>{
    const c=mk();
    renderStatusBar();
    const el=document.getElementById("statusbar");
    eq(el.className,"","nothing to show for a healthy character");
    c.conditions=["Poisoned"];c.exhaustion=2;c.concentration="Bless";
    renderStatusBar();
    eq(el.className,"on");
    ok(/Poisoned/.test(el.innerHTML));ok(/Exhaustion 2/.test(el.innerHTML));ok(/Bless/.test(el.innerHTML));
    c.conditions=[];c.exhaustion=0;c.concentration=null;
    renderStatusBar();
    eq(el.className,"","hidden again");});
  t("every tab renders without throwing",()=>{
    const c=mk(x=>{x.conditions=["Poisoned"];x.exhaustion=1;
      x.companions.push({id:"w",name:"Wolf",kind:"companion",ac:13,hpMax:11,hpCur:11,active:true,attacks:[{name:"Bite",hit:4,dmg:"2d4+2"}]});
      x.features.push({name:"Pinned thing",fav:true,effects:[]});});
    ["main","skills","spells","comp","inv","feat"].forEach(tab=>{
      curTab=tab;
      ({main:renderMain,skills:renderSkills,spells:renderSpells,comp:renderComp,inv:renderInv,feat:renderFeat})[tab]();
      ok(document.getElementById("scr-"+tab).innerHTML.length>50,tab+" tab drew something");});
    curTab="main";});

  /* ---- homebrew reaches every picker ---- */
  t("homebrew races are offered in the character editor",()=>{
    const keep=db.customRaces;
    db.customRaces=[{name:"Testling",size:"Small",speed:25,asi:{dex:2},traits:[]}];
    mk();
    ok(allRaces().some(r=>r.name==="Testling"),"allRaces includes homebrew");
    ok(!!findRace("Testling"),"findRace resolves it");
    openModal=real.openModal;
    try{
      editIdentity();
      ok([...document.querySelectorAll("#raceList option")].map(o=>o.value).includes("Testling"),
         "Edit character lists the homebrew race");
      real.closeModal();
      newCharWizard();
      ok([...document.querySelectorAll("#raceList option")].map(o=>o.value).includes("Testling"),
         "the creation wizard lists it too");
    }finally{real.closeModal();openModal=()=>{};db.customRaces=keep;}});

  }finally{
    cancelHp(); /* never leave a timer that would fire against the restored db */
    save=real.save;toast=real.toast;openModal=real.openModal;closeModal=real.closeModal;renderTab=real.renderTab;
    window.confirm=real.confirm;window.prompt=real.prompt;
    db=JSON.parse(snapshot);
    try{cur()?renderTab():showList();}catch(_){}
  }

  const failed=results.filter(r=>!r.ok);
  window.__selftest={total:results.length,failed:failed.length,results};
  console.log("Grimoire self-tests: "+(results.length-failed.length)+"/"+results.length+" passed");
  failed.forEach(f=>console.error("FAIL — "+f.name+" — "+f.msg));
  const box=document.createElement("div");
  box.id="selftestReport";
  box.style.cssText="position:fixed;inset:0;z-index:9999;overflow:auto;background:var(--bg);padding:16px";
  box.innerHTML='<h1 style="color:'+(failed.length?"var(--red)":"var(--green)")+'">'
    +(failed.length?"❌ "+failed.length+" failed":"✅ All passed")
    +' <span class="dim" style="font-size:15px">('+results.length+" checks)</span></h1>"
    +'<button class="btn ghost" style="width:100%;margin:8px 0" onclick="this.parentElement.remove()">Close and use the app</button>'
    +results.map(r=>'<div class="skrow"><div class="nm" style="font-size:14px">'+(r.ok?"✅":"❌")+" "+esc(r.name)
      +(r.ok?"":'<div class="dim" style="color:var(--red)">'+esc(r.msg)+"</div>")+"</div></div>").join("");
  document.body.appendChild(box);
  return window.__selftest;}

/* ================== INIT ================== */
(async function init(){
  load();await loadSrd();
  if(db.currentId&&cur())openChar(db.currentId);else showList();
  if("serviceWorker" in navigator&&location.protocol!=="file:")
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  if(/[?&]selftest=1/.test(location.search)){try{runSelfTests();}catch(e){reportError("Self-tests",e);}}
})();

</script>
